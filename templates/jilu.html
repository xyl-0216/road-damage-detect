<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - 道路损坏评估系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .record-card {
            margin-bottom: 1rem;
            transition: transform 0.3s;
        }
        .record-card:hover {
            transform: translateY(-5px);
        }
        .damage-rate {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .high-damage {
            color: #dc3545;
        }
        .medium-damage {
            color: #ffc107;
        }
        .low-damage {
            color: #28a745;
        }
        .filter-section {
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .stat-card {
            text-align: center;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .stat-card i {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">历史记录</h1>
        
        <!-- 统计信息 -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="stat-card bg-primary text-white">
                    <i class="fas fa-road"></i>
                    <h3>总检测道路</h3>
                    <p class="h4">128 条</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card bg-success text-white">
                    <i class="fas fa-chart-pie"></i>
                    <h3>平均损坏率</h3>
                    <p class="h4">4.5%</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card bg-warning text-white">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>严重损坏</h3>
                    <p class="h4">12 处</p>
                </div>
            </div>
        </div>

        <!-- 筛选器 -->
        <div class="filter-section">
            <div class="row">
                <div class="col-md-3">
                    <label for="dateFilter" class="form-label">日期范围</label>
                    <input type="date" class="form-control" id="dateFilter">
                </div>
                <div class="col-md-3">
                    <label for="damageFilter" class="form-label">损坏程度</label>
                    <select class="form-select" id="damageFilter">
                        <option value="all">全部</option>
                        <option value="high">严重损坏 (>10%)</option>
                        <option value="medium">中等损坏 (5-10%)</option>
                        <option value="low">轻微损坏 (<5%)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="locationFilter" class="form-label">位置</label>
                    <input type="text" class="form-control" id="locationFilter" placeholder="输入位置关键词">
                </div>
                <div class="col-md-3">
                    <label class="form-label">&nbsp;</label>
                    <button class="btn btn-primary w-100" id="searchButton">
                        <i class="fas fa-search me-2"></i>搜索
                    </button>
                </div>
            </div>
        </div>

        <!-- 记录列表 -->
        <div class="row">
            <div class="col-md-6">
                <div class="card record-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="card-title">东城区主干道</h5>
                            <span class="damage-rate high-damage">12.5%</span>
                        </div>
                        <p class="card-text">
                            <i class="fas fa-calendar me-2"></i>2024-04-20 14:30
                            <br>
                            <i class="fas fa-map-marker-alt me-2"></i>东城区建国路
                        </p>
                        <div class="d-flex justify-content-between">
                            <button class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-eye me-1"></i>查看详情
                            </button>
                            <button class="btn btn-sm btn-outline-success">
                                <i class="fas fa-download me-1"></i>下载报告
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card record-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="card-title">西城区环线</h5>
                            <span class="damage-rate medium-damage">7.2%</span>
                        </div>
                        <p class="card-text">
                            <i class="fas fa-calendar me-2"></i>2024-04-19 10:15
                            <br>
                            <i class="fas fa-map-marker-alt me-2"></i>西城区复兴路
                        </p>
                        <div class="d-flex justify-content-between">
                            <button class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-eye me-1"></i>查看详情
                            </button>
                            <button class="btn btn-sm btn-outline-success">
                                <i class="fas fa-download me-1"></i>下载报告
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 分页 -->
        <nav aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item disabled">
                    <a class="page-link" href="#" tabindex="-1">上一页</a>
                </li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item">
                    <a class="page-link" href="#">下一页</a>
                </li>
            </ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 添加筛选功能
        document.getElementById('searchButton').addEventListener('click', function() {
            // 这里添加筛选逻辑
            console.log('搜索按钮被点击');
        });
    </script>
</body>
</html>
